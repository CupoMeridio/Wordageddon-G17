name: Deploy Javadoc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Generazione documentazione Javadoc con Maven
        run: |
          mvn -B javadoc:javadoc
          mkdir -p target/docs-site
          if [ -d "target/reports/apidocs" ]; then
            cp -r target/reports/apidocs/* target/docs-site/
          elif [ -d "target/site/apidocs" ]; then
            cp -r target/site/apidocs/* target/docs-site/
          fi

      - name: Configurazione GitHub Pages
        uses: actions/configure-pages@v5

      - name: Caricamento artefatto per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'target/docs-site'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
