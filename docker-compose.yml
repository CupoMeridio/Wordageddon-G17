services:
  postgres:
    image: postgres:17-alpine
    container_name: wordageddon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wordageddon
      POSTGRES_USER: wordageddon
      POSTGRES_PASSWORD: wordageddon
    ports:
      - "5432:5432"
    volumes:
      - wordageddon_pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordageddon -d wordageddon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wordageddon_pgdata:
