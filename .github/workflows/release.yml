name: Rolling Release (Latest)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilazione e creazione Fat JAR con Maven
        run: mvn clean package javadoc:jar -DskipTests

      - name: Preparazione artefatti ed eseguibili con jpackage
        shell: pwsh
        run: |
          # 1. Crea una cartella di staging pulita contenente solo il Fat JAR
          New-Item -ItemType Directory -Force -Path "target/jpackage-input"
          $fatJar = Get-Item "target/*-jar-with-dependencies.jar", "target/*-shaded.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          Copy-Item $fatJar.FullName -Destination "target/jpackage-input/Wordageddon.jar"
          Copy-Item $fatJar.FullName -Destination "target/Wordageddon.jar"

          # 1b. Copia l'archivio Javadoc con nome normalizzato
          $javadocJar = Get-Item "target/*-javadoc.jar" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($javadocJar) {
            Copy-Item $javadocJar.FullName -Destination "target/Wordageddon-javadoc.jar"
          }

          # 2. Crea il pacchetto autonomo portatile (Cartella con .exe + Java Runtime integrato)
          jpackage --type app-image `
            --input "target/jpackage-input" `
            --name "Wordageddon" `
            --main-jar "Wordageddon.jar" `
            --main-class it.unisa.diem.wordageddong17.RunMain `
            --icon "src/main/resources/imgs/Logo_senza_sfondo.ico" `
            --dest "target/dist" `
            --java-options "--enable-native-access=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED"

          # 3. Comprimi la cartella dell'eseguibile in uno zip portabile
          Compress-Archive -Path "target/dist/Wordageddon" -DestinationPath "target/Wordageddon-Windows-Portable.zip"

          # 4. Crea l'installer Windows (.msi) riutilizzando l'app-image già generata
          jpackage --type msi `
            --app-image "target/dist/Wordageddon" `
            --name "Wordageddon" `
            --dest "target" `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser

      - name: Forza l'aggiornamento del tag "latest" al commit corrente
        shell: bash
        run: git push --force origin HEAD:refs/tags/latest

      - name: Pubblicazione / Aggiornamento Release "Latest"
        uses: ncipollo/release-action@v1
        with:
          tag: "latest"
          commit: ${{ github.sha }}
          name: "Latest Release (Continuous Build)"
          body: |
            Questa release contiene sempre la versione più recente compilata automaticamente dall'ultimo commit sul ramo principale `main`.

            ### 📦 File disponibili per il download:
            - **`Wordageddon-Windows-Portable.zip`**: Versione portabile per Windows (apri lo zip ed avvia `Wordageddon.exe`, **non richiede Java preinstallato**).
            - **`Wordageddon-*.msi`**: Pacchetto di installazione guidata per Windows (crea collegamenti sul Desktop e nel Menu Start, **non richiede Java preinstallato**).
            - **`Wordageddon.jar`**: File JAR eseguibile multipiattaforma (richiede Java 17 o superiore).
            - **`Wordageddon-javadoc.jar`**: Archivio completo della documentazione API Javadoc per consultazione offline.
          artifacts: "target/Wordageddon.jar,target/Wordageddon-javadoc.jar,target/Wordageddon-Windows-Portable.zip,target/*.msi"
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
